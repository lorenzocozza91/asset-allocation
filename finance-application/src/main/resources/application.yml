spring:
  application:
    name: asset-allocation
  datasource:
    url: jdbc:sqlite:${ASSET_ALLOCATION_DB:data/asset-allocation.db}
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
