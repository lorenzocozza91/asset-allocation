spring:
  application:
    name: asset-allocation
  datasource:
    url: jdbc:sqlite:${ASSET_ALLOCATION_DB:data/asset-allocation.db}
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

market-data:
  schedule:
    interval-ms: 3600000
    initial-delay-ms: 0
  yahoo-finance:
    base-url: https://query1.finance.yahoo.com
